<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromptCraft AI - Modo Estúdio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .prose blockquote {
      background-color: rgba(15, 23, 42, 0.7);
      border-left-color: #06b6d4;
      border-left-width: 4px;
      padding: 12px 16px;
      border-radius: 0 12px 12px 0;
      margin-top: 10px;
      margin-bottom: 24px;
      color: #e2e8f0;
      font-style: normal;
    }
    .prose h3 {
      color: #38bdf8;
      margin-top: 28px !important;
      margin-bottom: 12px !important;
      border-bottom: 1px solid rgba(51, 65, 85, 0.6);
      padding-bottom: 6px;
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-3xl w-full bg-slate-800 p-6 sm:p-8 rounded-2xl shadow-2xl border border-slate-700 my-6">
    <h1 class="text-3xl font-extrabold text-center bg-gradient-to-r from-pink-500 to-cyan-400 bg-clip-text text-transparent">⚡ PromptCraft AI</h1>
    <p class="text-center text-slate-400 text-sm mt-2 mb-6">Gere roteiros virais e prompts visuais para TikTok, Shopee e Influencers IA.</p>

    <!-- Navegação Superior Entre Páginas -->
    <nav class="flex flex-wrap sm:flex-nowrap bg-slate-900 p-1.5 rounded-xl border border-slate-700 mb-6 gap-1 text-center">
      <a href="index.html" class="flex-1 min-w-[100px] py-2.5 rounded-lg text-xs sm:text-sm font-bold text-slate-400 hover:text-white transition-all">
        🏠 Início
      </a>
      <a href="estudio.html" class="flex-1 min-w-[100px] py-2.5 rounded-lg text-xs sm:text-sm font-bold bg-gradient-to-r from-pink-600 to-cyan-500 text-white shadow">
        🎛️ Estúdio
      </a>
      <a href="express.html" class="flex-1 min-w-[100px] py-2.5 rounded-lg text-xs sm:text-sm font-bold text-slate-400 hover:text-white transition-all">
        ⚡ Express (URL)
      </a>
      <a href="influencer.html" class="flex-1 min-w-[100px] py-2.5 rounded-lg text-xs sm:text-sm font-bold text-slate-400 hover:text-white transition-all">
        🎭 Influencer IA
      </a>
    </nav>
    
    <div class="space-y-5">
      <div>
        <label class="block text-sm font-semibold mb-2 text-slate-300">📦 Dados do Produto:</label>
        <textarea id="produto" class="w-full p-4 bg-slate-900 border border-slate-600 rounded-xl text-sm focus:outline-none focus:border-pink-500 transition-colors placeholder-slate-500" rows="4" placeholder="Ex: Cadeirinha de bebê para automóvel com reclinamento..."></textarea>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-2 text-slate-300">🎬 Estilo do Vídeo:</label>
          <select id="estilo" class="w-full p-3 bg-slate-900 border border-slate-600 rounded-xl text-sm focus:outline-none focus:border-pink-500">
            <option>Review Sincero</option>
            <option>Achadinho Irresistível</option>
            <option>Problema vs Solução</option>
            <option>Unboxing</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2 text-slate-300">🗣️ Tom da Narração:</label>
          <select id="tom" class="w-full p-3 bg-slate-900 border border-slate-600 rounded-xl text-sm focus:outline-none focus:border-pink-500">
            <option>Entusiasta</option>
            <option>Curioso/Alerta</option>
            <option>Humorado</option>
            <option>Direto ao Ponto</option>
          </select>
        </div>
      </div>

      <button onclick="gerarPrompt()" id="btn" class="w-full py-4 mt-2 bg-gradient-to-r from-pink-600 to-cyan-500 font-bold rounded-xl hover:opacity-90 transform transition hover:scale-[1.02] shadow-lg">
        🚀 Gerar Roteiro e Prompts
      </button>
    </div>

    <!-- Status de Carregamento -->
    <div id="loading" class="hidden text-center mt-6 p-4 bg-slate-900/50 rounded-xl border border-slate-700">
      <p id="status-texto" class="text-cyan-400 font-semibold animate-pulse">🤖 Conectando à IA e gerando seu roteiro... Aguarde!</p>
    </div>

    <!-- Área do Resultado (Container de Cards) -->
    <div id="resultado" class="mt-8 space-y-6 text-sm hidden">
    </div>
  </div>

  <script>
    const API_KEY = "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";

    // Verifica se veio um produto pré-selecionado da Landing Page (index.html)
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const produtoParam = urlParams.get('produto');
      
      if (produtoParam) {
        document.getElementById('produto').value = produtoParam;
        gerarPrompt();
      }
    });

    async function obterModelosValidosGroq(apiKey) {
      try {
        const response = await fetch("https://api.groq.com/openai/v1/models", {
          headers: { "Authorization": `Bearer ${apiKey}` }
        });
        const data = await response.json();
        
        if (data && data.data && data.data.length > 0) {
          const modelosFiltrados = data.data
            .map(m => m.id)
            .filter(id => {
              const lower = id.toLowerCase();
              return !lower.includes("whisper") && 
                     !lower.includes("guard") && 
                     !lower.includes("vision") && 
                     !lower.includes("embed") &&
                     !lower.includes("audio");
            });

          modelosFiltrados.sort((a, b) => {
            if (a.includes("llama-3.3")) return -1;
            if (b.includes("llama-3.3")) return 1;
            if (a.includes("llama-3.1")) return -1;
            if (b.includes("llama-3.1")) return 1;
            return 0;
          });

          if (modelosFiltrados.length > 0) return modelosFiltrados;
        }
      } catch (e) {
        console.warn("Erro ao buscar modelos da API.", e);
      }
      return ["llama-3.3-70b-versatile", "llama-3.1-8b-instant"];
    }

    async function gerarPrompt() {
      const btn = document.getElementById('btn');
      const resDiv = document.getElementById('resultado');
      const loadDiv = document.getElementById('loading');
      const produto = document.getElementById('produto').value;
      const estilo = document.getElementById('estilo').value;
      const tom = document.getElementById('tom').value;

      if (!produto.trim()) {
        alert('⚠️ Por favor, insira os dados do produto.');
        return;
      }

      btn.disabled = true;
      btn.classList.add('opacity-50');
      loadDiv.classList.remove('hidden');
      resDiv.classList.add('hidden');

      const promptMaster = `
        Você é um copywriter sênior de resposta direta especializado em TikTok Shop e Shopee.
        Crie uma análise minuciosa de mercado (pontos fortes e negativos), um roteiro comercial em português e prompts visuais técnicos em inglês com tradução destacada.

        DADOS DO PRODUTO: ${produto}
        ESTILO: ${estilo}
        TOM DA NARRAÇÃO: ${tom}

        REGRAS ABSOLUTAS DE FORMATO:
        1. FALE ESTRITAMENTE SOBRE O PRODUTO MENCIONADO ACIMA.
        2. SEPARE CADA UMA DAS 3 SEÇÕES USANDO O DELIMITADOR EXATO '---'.
        3. NÃO USE COLCHETES [ ] OU TEXTOS DE INSTRUÇÃO COMO "digite aqui".
        4. EM CADA PROMPT VISUAL, COLOQUE O CÓDIGO EM INGLÊS PRIMEIRO E LOGO ABAIXO A TRADUÇÃO EM UM BLOCO DE CITAÇÃO (>).

        RETORNE ESTRITAMENTE NESTE FORMATO:

        ## 🔍 ANÁLISE DE MERCADO & INSIGHTS

        * **👍 Pontos Fortes (O que os compradores mais amam):**
          - Explicar os 2 maiores elogios ou recursos de destaque do produto.

        * **⚠️ Pontos Negativos & Objeções (Principais dúvidas/reclamações):**
          - Explicar as 2 maiores dúvidas, medos ou reclamações de compradores.

        * **🎯 Estratégia de Venda do Roteiro:**
          - Resumo de como o roteiro abaixo usa os pontos fortes para destruir as objeções.

        ---

        ## 📜 ROTEIRO DE VÍDEO & NARRAÇÃO

        **Cena 1 (0-3s) - Gancho Viral:**
        🗣️ Narração: Frase chamativa em português focada nos primeiros 3 segundos deste produto especificamente.

        **Cena 2 (3-12s) - Demonstração & Solução:**
        🗣️ Narração: Demonstração persuasiva em português destacando os benefícios reais e quebrando as objeções mineradas.

        **Cena 3 (12-15s) - Chamada para Ação:**
        🗣️ Narração: Chamada em português para clicar no link da bio ou carrinho amarelo.

        ---

        ## 🎬 PROMPTS VISUAIS (PRONTOS PARA COPIAR E COLAR)

        ### 🟢 Cena 1: Prompt Visual (Gancho Inicial)

        \`\`\`text
        Detailed technical prompt in English for initial scene showing the exact product, 4k resolution, 9:16 vertical ratio, photorealistic, cinematic lighting
        \`\`\`

        > 🇧🇷 **Tradução em Português (Cena 1):**
        > Tradução detalhada e explicação visual em português do que a IA vai gerar na Cena 1.

        ### 🔵 Cena 2: Prompt Visual (Demonstração e Benefícios)

        \`\`\`text
        Detailed technical prompt in English showing the exact product in use resolving buyer objection, close-up details, 4k, 9:16 vertical ratio
        \`\`\`

        > 🇧🇷 **Tradução em Português (Cena 2):**
        > Tradução detalhada e explicação visual em português do que a IA vai gerar na Cena 2.

        ### 🟣 Cena 3: Prompt Visual (Chamada para Ação)

        \`\`\`text
        Detailed technical prompt in English for call-to-action scene with the product, 4k, 9:16 vertical ratio
        \`\`\`

        > 🇧🇷 **Tradução em Português (Cena 3):**
        > Tradução detalhada e explicação visual em português do que a IA vai gerar na Cena 3.
      `;

      let textoGerado = null;
      let erroUltimo = "";

      const modelosDisponiveis = await obterModelosValidosGroq(API_KEY);

      for (const modeloId of modelosDisponiveis) {
        try {
          const response = await fetch(`https://api.groq.com/openai/v1/chat/completions`, {
            method: 'POST',
            headers: { 
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
              model: modeloId,
              messages: [
                {
                  role: "system",
                  content: "Você é um gerador de roteiros comerciais de alta conversão. Escreva obrigatoriamente os pontos fortes, pontos negativos (objeções), roteiro e os prompts técnicos com traduções separadas."
                },
                {
                  role: "user",
                  content: promptMaster
                }
              ],
              temperature: 0.4
            })
          });

          const data = await response.json();

          if (response.ok && data.choices && data.choices[0] && data.choices[0].message.content) {
            textoGerado = data.choices[0].message.content;
            break;
          } else {
            erroUltimo = data.error?.message || 'Erro desconhecido';
          }
        } catch (e) {
          erroUltimo = e.message;
        }
      }

      if (textoGerado) {
        const avisoSucesso = `<div class="p-3 bg-emerald-500/20 border border-emerald-500 text-emerald-400 rounded-xl text-center font-bold mb-4 text-base animate-bounce">✅ Prompt gerado com sucesso!</div>`;
        
        const secoes = textoGerado.split('---');
        let htmlResultado = avisoSucesso;

        secoes.forEach(secao => {
          if (secao.trim()) {
            htmlResultado += `
              <div class="bg-slate-950/80 p-6 rounded-2xl border border-slate-700/80 shadow-xl prose prose-invert prose-p:leading-relaxed max-w-none">
                ${marked.parse(secao.trim())}
              </div>
            `;
          }
        });

        resDiv.innerHTML = htmlResultado;
        adicionarBotoesDeCopiar(resDiv);
        resDiv.classList.remove('hidden');
        resDiv.scrollIntoView({ behavior: 'smooth' });
      } else {
        alert('❌ Erro na API Groq: ' + erroUltimo);
      }

      loadDiv.classList.add('hidden');
      btn.disabled = false;
      btn.classList.remove('opacity-50');
    }

    function adicionarBotoesDeCopiar(container) {
      const blocosCodigo = container.querySelectorAll('pre');
      blocosCodigo.forEach((pre) => {
        pre.className = 'relative bg-slate-900 p-4 pt-12 rounded-xl border border-slate-700/70 my-3 text-xs font-mono text-cyan-300 whitespace-pre-wrap break-words overflow-hidden shadow-inner';
        
        const btnCopiar = document.createElement('button');
        btnCopiar.className = 'absolute top-2.5 right-2.5 px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold rounded-lg shadow transition-all flex items-center gap-1 z-10 cursor-pointer';
        btnCopiar.innerHTML = '📋 Copiar Prompt';

        btnCopiar.onclick = () => {
          const codeEl = pre.querySelector('code');
          const textoOriginal = codeEl ? codeEl.innerText : pre.innerText;
          const textoPrompt = textoOriginal.replace(/📋 Copiar Prompt|✅ Copiado!/g, '').trim();

          navigator.clipboard.writeText(textoPrompt).then(() => {
            btnCopiar.innerHTML = '✅ Copiado!';
            btnCopiar.className = 'absolute top-2.5 right-2.5 px-3 py-1.5 bg-emerald-600 text-white text-xs font-bold rounded-lg shadow transition-all flex items-center gap-1 z-10';
            setTimeout(() => {
              btnCopiar.innerHTML = '📋 Copiar Prompt';
              btnCopiar.className = 'absolute top-2.5 right-2.5 px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold rounded-lg shadow transition-all flex items-center gap-1 z-10 cursor-pointer';
            }, 2000);
          });
        };

        pre.appendChild(btnCopiar);
      });
    }
  </script>
</body>
</html>
