<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromptCraft AI - TikTok & Shopee</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-2xl w-full bg-slate-800 p-6 sm:p-8 rounded-2xl shadow-2xl border border-slate-700 my-6">
    <h1 class="text-3xl font-extrabold text-center bg-gradient-to-r from-pink-500 to-cyan-400 bg-clip-text text-transparent">⚡ PromptCraft AI</h1>
    <p class="text-center text-slate-400 text-sm mt-2 mb-6">Gere roteiros virais e prompts visuais para TikTok e Shopee em segundos.</p>

    <!-- Alternador de Modos (Tabs) -->
    <div class="flex bg-slate-900 p-1.5 rounded-xl border border-slate-700 mb-6">
      <button id="tab-estudio" onclick="alternarModo('estudio')" class="flex-1 py-2.5 rounded-lg text-sm font-bold transition-all bg-gradient-to-r from-pink-600 to-cyan-500 text-white shadow">
        🎛️ Modo Estúdio (Filtros)
      </button>
      <button id="tab-express" onclick="alternarModo('express')" class="flex-1 py-2.5 rounded-lg text-sm font-bold transition-all text-slate-400 hover:text-white">
        ⚡ Modo Express (URL)
      </button>
    </div>
    
    <div class="space-y-5">
      <!-- Painel Modo Estúdio -->
      <div id="painel-estudio" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold mb-2 text-slate-300">📦 Dados do Produto:</label>
          <textarea id="produto" class="w-full p-4 bg-slate-900 border border-slate-600 rounded-xl text-sm focus:outline-none focus:border-pink-500 transition-colors placeholder-slate-500" rows="4" placeholder="Ex: Furadeira elétrica portátil sem fio com bateria de longa duração..."></textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold mb-2 text-slate-300">🎬 Estilo do Vídeo:</label>
            <select id="estilo" class="w-full p-3 bg-slate-900 border border-slate-600 rounded-xl text-sm focus:outline-none focus:border-pink-500">
              <option>Review Sincero</option>
              <option>Achadinho Irresistível</option>
              <option>Problema vs Solução</option>
              <option>Unboxing</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold mb-2 text-slate-300">🗣️ Tom da Narração:</label>
            <select id="tom" class="w-full p-3 bg-slate-900 border border-slate-600 rounded-xl text-sm focus:outline-none focus:border-pink-500">
              <option>Entusiasta</option>
              <option>Curioso/Alerta</option>
              <option>Humorado</option>
              <option>Direto ao Ponto</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Painel Modo Express (Link do Produto) -->
      <div id="painel-express" class="hidden space-y-4">
        <div>
          <label class="block text-sm font-semibold mb-2 text-slate-300">🔗 Link do Produto (Shopee, Mercado Livre, TikTok):</label>
          <input type="url" id="url-produto" class="w-full p-4 bg-slate-900 border border-slate-600 rounded-xl text-sm focus:outline-none focus:border-cyan-400 transition-colors placeholder-slate-500" placeholder="https://shopee.com.br/produto-exemplo-123456" />
          <p class="text-xs text-slate-400 mt-2">💡 Cole a URL para gerar o roteiro e os prompts visuais.</p>
        </div>
      </div>

      <button onclick="gerarPrompt()" id="btn" class="w-full py-4 mt-2 bg-gradient-to-r from-pink-600 to-cyan-500 font-bold rounded-xl hover:opacity-90 transform transition hover:scale-[1.02] shadow-lg">
        🚀 Gerar Roteiro e Prompts
      </button>
    </div>

    <!-- Status de Carregamento -->
    <div id="loading" class="hidden text-center mt-6 p-4 bg-slate-900/50 rounded-xl border border-slate-700">
      <p class="text-cyan-400 font-semibold animate-pulse">🤖 Conectando à IA e gerando seu roteiro... Aguarde!</p>
    </div>

    <!-- Área do Resultado -->
    <div id="resultado" class="mt-8 space-y-4 text-sm bg-slate-900 p-6 rounded-xl border border-slate-700 hidden prose prose-invert prose-p:leading-relaxed">
    </div>
  </div>

  <script>
    const API_KEY = "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";
    let modoAtual = 'estudio';

    function alternarModo(modo) {
      modoAtual = modo;
      const tabEstudio = document.getElementById('tab-estudio');
      const tabExpress = document.getElementById('tab-express');
      const painelEstudio = document.getElementById('painel-estudio');
      const painelExpress = document.getElementById('painel-express');

      if (modo === 'estudio') {
        tabEstudio.className = "flex-1 py-2.5 rounded-lg text-sm font-bold transition-all bg-gradient-to-r from-pink-600 to-cyan-500 text-white shadow";
        tabExpress.className = "flex-1 py-2.5 rounded-lg text-sm font-bold transition-all text-slate-400 hover:text-white";
        painelEstudio.classList.remove('hidden');
        painelExpress.classList.add('hidden');
      } else {
        tabExpress.className = "flex-1 py-2.5 rounded-lg text-sm font-bold transition-all bg-gradient-to-r from-pink-600 to-cyan-500 text-white shadow";
        tabEstudio.className = "flex-1 py-2.5 rounded-lg text-sm font-bold transition-all text-slate-400 hover:text-white";
        painelExpress.classList.remove('hidden');
        painelEstudio.classList.add('hidden');
      }
    }

    async function obterModelosValidosGroq(apiKey) {
      try {
        const response = await fetch("https://api.groq.com/openai/v1/models", {
          headers: { "Authorization": `Bearer ${apiKey}` }
        });
        const data = await response.json();
        
        if (data && data.data && data.data.length > 0) {
          const modelosFiltrados = data.data
            .map(m => m.id)
            .filter(id => {
              const lower = id.toLowerCase();
              return !lower.includes("whisper") && 
                     !lower.includes("guard") && 
                     !lower.includes("vision") && 
                     !lower.includes("embed") &&
                     !lower.includes("audio");
            });

          modelosFiltrados.sort((a, b) => {
            if (a.includes("llama-3.3")) return -1;
            if (b.includes("llama-3.3")) return 1;
            if (a.includes("llama-3.1")) return -1;
            if (b.includes("llama-3.1")) return 1;
            return 0;
          });

          if (modelosFiltrados.length > 0) return modelosFiltrados;
        }
      } catch (e) {
        console.warn("Erro ao buscar modelos da API.", e);
      }
      return ["llama-3.3-70b-versatile", "llama-3.1-8b-instant"];
    }

    async function gerarPrompt() {
      const btn = document.getElementById('btn');
      const resDiv = document.getElementById('resultado');
      const loadDiv = document.getElementById('loading');

      let produto = "";
      let estilo = "Achadinho Irresistível";
      let tom = "Entusiasta";

      if (modoAtual === 'estudio') {
        produto = document.getElementById('produto').value;
        estilo = document.getElementById('estilo').value;
        tom = document.getElementById('tom').value;

        if (!produto.trim()) {
          alert('⚠️ Por favor, insira os dados do produto.');
          return;
        }
      } else {
        const url = document.getElementById('url-produto').value;
        if (!url.trim()) {
          alert('⚠️ Por favor, cole o link do produto.');
          return;
        }
        produto = "Produto informado via URL: " + url;
      }

      btn.disabled = true;
      btn.classList.add('opacity-50');
      loadDiv.classList.remove('hidden');
      resDiv.classList.add('hidden');

      const promptMaster = `
        Você é um copywriter sênior de resposta direta especializado em TikTok Shop e Shopee.
        Escreva o roteiro REAL de um vídeo curto de alta conversão (15 a 30 segundos) para o produto informado.

        INFORMAÇÕES DO PRODUTO OU URL: ${produto}
        ESTILO DO VÍDEO: ${estilo}
        TOM DA NARRAÇÃO: ${tom}

        REGRAS RÍGIDAS DE GERAÇÃO:
        1. NUNCA use colchetes [ ], textos genéricos ou instruções como "digite aqui" ou "texto da cena".
        2. Escreva o texto de narração COMPLETO e FINAL em Português do Brasil, pronto para ser lido ou dublado no CapCut.
        3. Crie prompts visuais ultra detalhados em INGLÊS focados na geração por IA de vídeo (Kling AI, Luma, Runway), incluindo detalhes de iluminação, movimento de câmera, resolução 4k e proporção vertical 9:16.

        RETORNE ESTRITAMENTE NESTE FORMATO MARKDOWN:

        ## 📜 ROTEIRO DE VÍDEO & NARRAÇÃO

        **Cena 1 (0-3s) - Gancho Viral:**
        🗣️ Narração: (Escreva aqui a frase chocante ou curiosa para prender o espectador)

        **Cena 2 (3-12s) - Demonstração & Solução:**
        🗣️ Narração: (Escreva aqui a explicação persuasiva mostrando o benefício do produto)

        **Cena 3 (12-15s) - Chamada para Ação:**
        🗣️ Narração: (Escreva aqui a chamada final para clicar no link)

        ---

        ## 🎬 PROMPTS VISUAIS (PRONTOS PARA COPIAR E COLAR)

        **Prompt Visual - Cena 1:**
        \`\`\`text
        (Escreva o prompt técnico em inglês detalhando a cena inicial em 9:16, 4k, hyper-realistic)
        \`\`\`

        **Prompt Visual - Cena 2:**
        \`\`\`text
        (Escreva o prompt técnico em inglês detalhando o produto em uso em 9:16, 4k)
        \`\`\`

        **Prompt Visual - Cena 3:**
        \`\`\`text
        (Escreva o prompt técnico em inglês detalhando a cena de oferta em 9:16)
        \`\`\`
      `;

      let textoGerado = null;
      let erroUltimo = "";

      const modelosDisponiveis = await obterModelosValidosGroq(API_KEY);

      for (const modeloId of modelosDisponiveis) {
        try {
          const response = await fetch(`https://api.groq.com/openai/v1/chat/completions`, {
            method: 'POST',
            headers: { 
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
              model: modeloId,
              messages: [
                {
                  role: "system",
                  content: "Você é um gerador de roteiros comerciais que nunca produz textos marcadores de posição ou colchetes. Toda resposta deve conter cópia real e pronta."
                },
                {
                  role: "user",
                  content: promptMaster
                }
              ],
              temperature: 0.6
            })
          });

          const data = await response.json();

          if (response.ok && data.choices && data.choices[0] && data.choices[0].message.content) {
            textoGerado = data.choices[0].message.content;
            break;
          } else {
            erroUltimo = data.error?.message || 'Erro desconhecido';
          }
        } catch (e) {
          erroUltimo = e.message;
        }
      }

      if (textoGerado) {
        const avisoSucesso = `<div class="p-3 bg-emerald-500/20 border border-emerald-500 text-emerald-400 rounded-xl text-center font-bold mb-6 text-base animate-bounce">✅ Prompt gerado com sucesso!</div>`;
        resDiv.innerHTML = avisoSucesso + marked.parse(textoGerado);
        adicionarBotoesDeCopiar(resDiv);
        resDiv.classList.remove('hidden');
        resDiv.scrollIntoView({ behavior: 'smooth' });
      } else {
        alert('❌ Erro na API Groq: ' + erroUltimo);
      }

      loadDiv.classList.add('hidden');
      btn.disabled = false;
      btn.classList.remove('opacity-50');
    }

    // Formata o container do prompt com quebra de linha perfeita e botão fixado no topo
    function adicionarBotoesDeCopiar(container) {
      const blocosCodigo = container.querySelectorAll('pre');
      blocosCodigo.forEach((pre) => {
        pre.className = 'relative bg-slate-950 p-4 pt-12 rounded-xl border border-slate-700 my-4 text-xs font-mono text-slate-200 whitespace-pre-wrap break-words overflow-hidden shadow-inner';
        
        const btnCopiar = document.createElement('button');
        btnCopiar.className = 'absolute top-2.5 right-2.5 px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold rounded-lg shadow transition-all flex items-center gap-1 z-10 cursor-pointer';
        btnCopiar.innerHTML = '📋 Copiar Prompt';

        btnCopiar.onclick = () => {
          const codeEl = pre.querySelector('code');
          const textoOriginal = codeEl ? codeEl.innerText : pre.innerText;
          
          // Filtra o rótulo do botão caso o innerText acabe incluindo o texto do elemento filho
          const textoPrompt = textoOriginal.replace(/📋 Copiar Prompt|✅ Copiado!/g, '').trim();

          navigator.clipboard.writeText(textoPrompt).then(() => {
            btnCopiar.innerHTML = '✅ Copiado!';
            btnCopiar.className = 'absolute top-2.5 right-2.5 px-3 py-1.5 bg-emerald-600 text-white text-xs font-bold rounded-lg shadow transition-all flex items-center gap-1 z-10';
            setTimeout(() => {
              btnCopiar.innerHTML = '📋 Copiar Prompt';
              btnCopiar.className = 'absolute top-2.5 right-2.5 px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold rounded-lg shadow transition-all flex items-center gap-1 z-10 cursor-pointer';
            }, 2000);
          });
        };

        pre.appendChild(btnCopiar);
      });
    }
  </script>
</body>
</html>
