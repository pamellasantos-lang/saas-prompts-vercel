<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromptCraft AI - TikTok & Shopee</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-2xl w-full bg-slate-800 p-6 sm:p-8 rounded-2xl shadow-2xl border border-slate-700 my-6">
    <h1 class="text-3xl font-extrabold text-center bg-gradient-to-r from-pink-500 to-cyan-400 bg-clip-text text-transparent">⚡ PromptCraft AI</h1>
    <p class="text-center text-slate-400 text-sm mt-2 mb-6">Gere roteiros virais e prompts visuais para TikTok e Shopee em segundos.</p>
    
    <div class="space-y-5">
      <div>
        <label class="block text-sm font-semibold mb-2 text-slate-300">📦 Dados do Produto:</label>
        <textarea id="produto" class="w-full p-4 bg-slate-900 border border-slate-600 rounded-xl text-sm focus:outline-none focus:border-pink-500 transition-colors placeholder-slate-500" rows="4" placeholder="Ex: Mini Seladora de Embalagens a Pilha. Veda sacos de salgadinho em segundos..."></textarea>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-2 text-slate-300">🎬 Estilo do Vídeo:</label>
          <select id="estilo" class="w-full p-3 bg-slate-900 border border-slate-600 rounded-xl text-sm focus:outline-none focus:border-pink-500">
            <option>Review Sincero</option>
            <option>Achadinho Irresistível</option>
            <option>Problema vs Solução</option>
            <option>Unboxing</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2 text-slate-300">🗣️ Tom da Narração:</label>
          <select id="tom" class="w-full p-3 bg-slate-900 border border-slate-600 rounded-xl text-sm focus:outline-none focus:border-pink-500">
            <option>Entusiasta</option>
            <option>Curioso/Alerta</option>
            <option>Humorado</option>
            <option>Direto ao Ponto</option>
          </select>
        </div>
      </div>

      <button onclick="gerarPrompt()" id="btn" class="w-full py-4 mt-2 bg-gradient-to-r from-pink-600 to-cyan-500 font-bold rounded-xl hover:opacity-90 transform transition hover:scale-[1.02] shadow-lg">
        🚀 Gerar Roteiro e Prompts
      </button>
    </div>

    <!-- Status de Carregamento -->
    <div id="loading" class="hidden text-center mt-6 p-4 bg-slate-900/50 rounded-xl border border-slate-700">
      <p class="text-cyan-400 font-semibold animate-pulse">🤖 Conectando à IA e elaborando os roteiros... Aguarde!</p>
    </div>

    <!-- Área do Resultado -->
    <div id="resultado" class="mt-8 space-y-4 text-sm bg-slate-900 p-6 rounded-xl border border-slate-700 hidden overflow-x-auto prose prose-invert prose-p:leading-relaxed prose-pre:bg-slate-950 prose-pre:border prose-pre:border-slate-700">
    </div>
  </div>

  <script>
    // Insira a sua chave da Groq (gsk_...) entre as aspas:
    const API_KEY = "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";

    // Busca apenas modelos de texto (exclui modelos de áudio como Whisper)
    async function obterModeloGroq(apiKey) {
      try {
        const response = await fetch("https://api.groq.com/openai/v1/models", {
          headers: { "Authorization": `Bearer ${apiKey}` }
        });
        const data = await response.json();
        
        if (data.data && data.data.length > 0) {
          // Filtra eliminando modelos de transcrição de áudio
          const modelosTexto = data.data.filter(m => 
            !m.id.toLowerCase().includes("whisper") && 
            (m.id.toLowerCase().includes("llama") || m.id.toLowerCase().includes("mixtral") || m.id.toLowerCase().includes("gemma"))
          );

          // Prioriza modelos rápidos e estáveis
          const preferencial = modelosTexto.find(m => m.id.includes("llama-3.1-8b") || m.id.includes("llama-3.3"));
          if (preferencial) return preferencial.id;
          if (modelosTexto.length > 0) return modelosTexto[0].id;
        }
      } catch (e) {
        console.warn("Utilizando modelo de fallback.", e);
      }
      return "llama-3.1-8b-instant";
    }

    async function gerarPrompt() {
      const btn = document.getElementById('btn');
      const produto = document.getElementById('produto').value;
      const estilo = document.getElementById('estilo').value;
      const tom = document.getElementById('tom').value;
      const resDiv = document.getElementById('resultado');
      const loadDiv = document.getElementById('loading');

      if (!produto.trim()) {
        alert('⚠️ Por favor, insira os dados do produto.');
        return;
      }

      btn.disabled = true;
      btn.classList.add('opacity-50');
      loadDiv.classList.remove('hidden');
      resDiv.classList.add('hidden');

      const promptMaster = `
        Você é um especialista em marketing de resposta direta para TikTok Shop e Shopee.
        Crie um roteiro de vídeo curto (15-30s) baseado nas informações do produto.

        PRODUTO: ${produto}
        ESTILO: ${estilo}
        TOM: ${tom}

        FORMATO EXATO DE RESPOSTA EM MARKDOWN:

        ### CENA 1: GANCHO VIRAL (0-3s)
        **🗣️ Narração (PT-BR):** [Texto da narração informal]
        **🎬 Prompt Visual (Inglês):**
        \`\`\`text
        [Prompt ultra detalhado em inglês: 4k, hyper-realistic, 9:16 ratio, iluminação e câmera]
        \`\`\`

        ### CENA 2: DEMONSTRAÇÃO E OBJEÇÃO (3-12s)
        **🗣️ Narração (PT-BR):** [Texto]
        **🎬 Prompt Visual (Inglês):**
        \`\`\`text
        [Prompt em inglês técnico]
        \`\`\`

        ### CENA 3: CHAMADA PARA AÇÃO (12-15s)
        **🗣️ Narração (PT-BR):** [Texto]
        **🎬 Prompt Visual (Inglês):**
        \`\`\`text
        [Prompt em inglês técnico]
        \`\`\`
      `;

      try {
        const modeloId = await obterModeloGroq(API_KEY);

        const response = await fetch(`https://api.groq.com/openai/v1/chat/completions`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: modeloId,
            messages: [
              {
                role: "user",
                content: promptMaster
              }
            ],
            temperature: 0.7
          })
        });

        const data = await response.json();

        if (response.ok && data.choices && data.choices[0].message.content) {
          const textoGerado = data.choices[0].message.content;
          resDiv.innerHTML = marked.parse(textoGerado);
          resDiv.classList.remove('hidden');
        } else {
          console.error("Detalhes da resposta da API:", data);
          alert('❌ Erro da API: ' + (data.error?.message || 'Erro desconhecido.'));
        }
      } catch (error) {
        alert('❌ Erro de conexão com a API da Groq: ' + error.message);
      } finally {
        loadDiv.classList.add('hidden');
        btn.disabled = false;
        btn.classList.remove('opacity-50');
      }
    }
  </script>
</body>
</html>
